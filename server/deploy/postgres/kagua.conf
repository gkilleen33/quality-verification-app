# Postgres tuning drop-in for the Kagua box.
# Installed to /etc/postgresql/16/main/conf.d/kagua.conf — postgresql.conf already
# has include_dir = 'conf.d', so the shipped config is never edited.
#
# Sized for a t3.medium: 3.8 GB total, shared with a JVM that will take roughly
# 1.3 GB (1 GB heap plus overhead) and an OS that needs a few hundred MB. Every
# number below is smaller than a Postgres-only box of this size would use, because
# the usual advice assumes the database is the only thing running.
#
# Restart required for shared_buffers and max_connections; the rest reload.

# 13% of RAM rather than the usual 25%. The JVM is the other tenant.
shared_buffers = 512MB

# What the planner assumes the OS will cache. Stock default is 4GB, which on this
# box is a lie that makes it prefer index scans it cannot actually afford.
effective_cache_size = 1536MB

# Per sort/hash node, not per connection, so the real ceiling is this times the
# number of concurrent nodes. 8MB against 40 connections is a worst case of a few
# hundred MB, which the swapfile can absorb if it ever happens.
work_mem = 8MB
maintenance_work_mem = 128MB

# Down from 100. The Ktor pool will hold about 10; each idle backend still costs
# memory, and 100 of them on 3.8 GB is a way to run out of it for no benefit.
max_connections = 40

# gp3 is SSD. The default of 4 dates from spinning disks and pushes the planner
# away from index scans that are in fact cheap here.
random_page_cost = 1.1
effective_io_concurrency = 200

# Fewer, larger checkpoints: less write amplification on a small volume.
checkpoint_completion_target = 0.9
min_wal_size = 128MB
max_wal_size = 2GB
wal_compression = on

# Anything over a second is worth seeing. Off by default (-1), and the first time
# a PostGIS radius query goes quadratic this is how we find out.
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on

# Off deliberately. JIT compilation pays for itself on long analytical queries and
# costs latency on the short ones this workload is made of, on a box with 2 vCPUs
# that the JVM also wants.
jit = off
