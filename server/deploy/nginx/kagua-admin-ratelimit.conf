# Rate limit zone for the admin login form.
#
# Installed to /etc/nginx/conf.d/ so it lands in nginx's http context: limit_req_zone is
# not valid inside a server block, which is why this is a separate file from the vhost.
#
# 10 requests/minute per address, with a burst of 5 in the vhost. An admin signing in types
# one password and one code; a script trying a wordlist wants thousands. The account lockout
# in the app is per account and so does nothing against one password sprayed across many
# addresses — this is the half that covers that.
#
# 10m of shared memory holds on the order of 160k addresses, which for a portal with three
# users is more headroom than it will ever need.
limit_req_zone $binary_remote_addr zone=kagua_admin_login:10m rate=10r/m;
