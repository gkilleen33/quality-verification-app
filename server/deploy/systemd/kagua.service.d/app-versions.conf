# Each app's latest and minimum versionCode, read by the server for GET /v1/auth/config
# and the 426 rule. A systemd drop-in rather than a line in kagua-run: none of these is a
# secret, and changing one is a release decision rather than a credential rotation.
#
# tools/deploy.sh installs it at every deploy, at /etc/systemd/system/kagua.service.d/, then
# runs systemctl daemon-reload before it restarts the service. It does not copy this file:
# tools/app-versions.sh writes each LATEST from the versionCode in the release's
# build.gradle.kts files, and keeps each MINIMUM and DOWNLOAD_URL as the installed file has
# them. So a release raises LATEST with no edit here, and a deploy never moves a MINIMUM.
# The values below are used only where the server has no installed value of its own.
# To change a MINIMUM, edit the installed file, daemon-reload, and restart kagua.
#
# LATEST is the versionCode of the release being deployed: an older install shows "A new
# version is available". MINIMUM stays 1. Raise it only for a security flaw, to close an
# unsafe old protocol, or for a server change old apps cannot use: an install below it is
# blocked and its requests are answered 426. Unset or unreadable values read as 1.
#
# DOWNLOAD_URL is what the Download button opens. Unset means the public release page,
# https://github.com/gkilleen33/quality-verification-app/releases/latest, which GitHub
# resolves to the newest tagged release.
#
# The LATEST values below are v0.6.1's: versionCode 7 in both apps. PesaLog (TRACKER)
# numbers its own versions from 1 (versionName 0.1.0), separately from the other two.

[Service]
Environment="KAGUA_APP_LATEST_KAGUA=7"
Environment="KAGUA_APP_MINIMUM_KAGUA=1"
Environment="KAGUA_APP_LATEST_FUNDI=7"
Environment="KAGUA_APP_MINIMUM_FUNDI=1"
Environment="KAGUA_APP_LATEST_TRACKER=1"
Environment="KAGUA_APP_MINIMUM_TRACKER=1"
