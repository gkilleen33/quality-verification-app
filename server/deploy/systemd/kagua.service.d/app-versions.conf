# Each app's latest and minimum versionCode, read by the server for GET /v1/auth/config
# and the 426 rule. A systemd drop-in rather than a line in kagua-run: none of these is a
# secret, and changing one is a release decision rather than a credential rotation.
#
# Installed by hand at a release's deploy, before the jar restarts:
#
#   install -D -m 0644 app-versions.conf /etc/systemd/system/kagua.service.d/app-versions.conf
#   systemctl daemon-reload
#
# then tools/deploy.sh restarts the service and the new values are live. To change only
# the values, edit the installed file, daemon-reload, and restart kagua.
#
# LATEST is the versionCode of the release being deployed: an older install shows "A new
# version is available". MINIMUM stays 1. Raise it only for a security flaw, to close an
# unsafe old protocol, or for a server change old apps cannot use: an install below it is
# blocked and its requests are answered 426. Unset or unreadable values read as 1.
#
# DOWNLOAD_URL is what the Download button opens. Unset means the public release page,
# https://github.com/gkilleen33/quality-verification-app/releases/latest, which GitHub
# resolves to the newest tagged release.
#
# The values below are v0.5.0's: versionCode 5 in both apps.

[Service]
Environment="KAGUA_APP_LATEST_KAGUA=5"
Environment="KAGUA_APP_MINIMUM_KAGUA=1"
Environment="KAGUA_APP_LATEST_FUNDI=5"
Environment="KAGUA_APP_MINIMUM_FUNDI=1"
