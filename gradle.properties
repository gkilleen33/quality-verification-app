# 4 GB, not 2: CI's check job runs lint on all three apps, the server tests and PesaLog's
# APK in one Gradle process, and lint's workers share its heap. At 2 GB the v0.7.0 branches
# failed with "Java heap space" in lintAnalyzeDebug (PR #114) and a packaging worker died
# with no cause printed (PR #113). GitHub's runners have 16 GB.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
